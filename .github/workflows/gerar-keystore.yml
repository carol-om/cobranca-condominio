name: Gerar keystore

on:
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest

    steps:
      - name: Configurar JDK 17
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Gerar arquivos do keystore
        run: |
          set -euo pipefail
          output_dir="$RUNNER_TEMP/keystore-artefato"
          keystore_path="$output_dir/debug-upload.keystore"
          password="$(openssl rand -hex 16)"
          mkdir -p "$output_dir"
          keytool -genkeypair -noprompt \
            -alias debug \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -keystore "$keystore_path" \
            -storepass "$password" \
            -keypass "$password" \
            -dname "CN=Debug, OU=Android, O=Exemplo, L=Sao Paulo, ST=SP, C=BR" \
            >/dev/null 2>&1
          base64 --wrap=0 "$keystore_path" > "$output_dir/keystore.b64"
          printf '%s\n' "$password" > "$output_dir/senha.txt"

      - name: Publicar arquivos para secrets
        uses: actions/upload-artifact@v4.6.2
        with:
          name: keystore-para-secrets
          path: |
            ${{ runner.temp }}/keystore-artefato/keystore.b64
            ${{ runner.temp }}/keystore-artefato/senha.txt
          retention-days: 1
